set-option -g set-titles on
set-option -g set-titles-string '#S:#I'
set-option -g renumber-windows on
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Session Persistence ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep this OFF so it doesn't fight with iTerm2 window generation
set -g @continuum-restore 'off'

# Continuum's autosave piggybacks on status-right redraws, which never happen with
# iTerm2 -CC clients. Save on a timer and on detach instead; restore manually with `trs`.
%if "#{!=:#{@autosave-loop},on}"
set -g @autosave-loop on
run -b 'while sleep 600; do tmux has-session 2>/dev/null || exit 0; "$(tmux show -gv @resurrect-save-script-path)" quiet; done'
%endif
set-hook -g client-detached 'run -b "#{@resurrect-save-script-path} quiet"'

# Relaunch Claude Code / Codex panes into the conversation they were running
set -g @resurrect-processes 'claude codex'
set -gF @resurrect-hook-post-save-layout '#{d:current_file}/tmux-resurrect-agents.sh'

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'tpack init'

# iTerm2 tmux integration doesn't like this
setw -g aggressive-resize off
